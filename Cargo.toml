[package]
name = "niteo"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.23"
globset = "0.4.15"
notify = "8.0.0"
notify-debouncer-full = "0.5.0"
rayon = "1.10"
oxc_allocator = "0.132.0"
oxc_ast = "0.132.0"
oxc_ast_visit = "0.132.0"
oxc_parser = "0.132.0"
oxc_span = "0.132.0"
oxc_syntax = "0.132.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "1.1.2"
blake3 = "1.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json"] }
criterion = "0.5"

[[bench]]
name = "cli_benchmarks"
harness = false

[[bench]]
name = "parallelism_benchmark"
harness = false
