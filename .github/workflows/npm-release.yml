name: NPM Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read
  id-token: write

jobs:
  detect-version:
    name: Detect package version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      package-name: ${{ steps.version.outputs.package-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect package version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_version="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          else
            previous_version=""
          fi

          current_version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"

          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json changed, but version stayed at $current_version"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "package-name=$package_name" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binary (${{ matrix.os }}-${{ matrix.arch }})
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: darwin
            arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: win32
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p npm/binaries/${{ matrix.os }}-${{ matrix.arch }}
          if [ "${{ matrix.os }}" = "win32" ]; then
            cp target/${{ matrix.target }}/release/niteo.exe npm/binaries/${{ matrix.os }}-${{ matrix.arch }}/niteo.exe
          else
            cp target/${{ matrix.target }}/release/niteo npm/binaries/${{ matrix.os }}-${{ matrix.arch }}/niteo
            chmod +x npm/binaries/${{ matrix.os }}-${{ matrix.arch }}/niteo
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: npm/binaries/${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  assemble-and-publish:
    name: Assemble and publish packages
    needs: [detect-version, build-binaries]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm/binaries
          pattern: binary-*
          merge-multiple: true

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          ls -laR npm/binaries/
          test -x npm/binaries/darwin-arm64/niteo
          test -x npm/binaries/darwin-x64/niteo
          test -x npm/binaries/linux-x64/niteo
          test -x npm/binaries/linux-arm64/niteo
          test -f npm/binaries/win32-x64/niteo.exe

      - name: Assemble npm packages
        run: node scripts/build-npm-packages.js

      - name: Check npm versions
        id: npm-check
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect-version.outputs.version }}"
          
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if npm view "@niteo/cli-$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "Platform package @niteo/cli-$pkg@$VERSION already exists"
            else
              echo "publish-$pkg=true" >> "$GITHUB_OUTPUT"
            fi
          done
          
          if npm view "${{ needs.detect-version.outputs.package-name }}@$VERSION" version >/dev/null 2>&1; then
            echo "publish-root=false" >> "$GITHUB_OUTPUT"
            echo "Root package ${{ needs.detect-version.outputs.package-name }}@$VERSION already exists"
          else
            echo "publish-root=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if [ "${{ steps.npm-check.outputs.publish-$pkg }}" = "true" ]; then
              echo "Publishing @niteo/cli-$pkg..."
              cd npm/@niteo/cli-$pkg
              npm publish --provenance --access public
              cd ../..
            else
              echo "Skipping @niteo/cli-$pkg (already published)"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root package
        if: steps.npm-check.outputs.publish-root == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
